global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Monitoring service Prometheus internal
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Monitoring Router MikroTik (Dual Path: Dev Simulator & Prod Fisik)
  - job_name: "snmp-mikrotik"
    metrics_path: /snmp
    params:
      module: [mikrotik]
    static_configs:
      # Jalur 1: Testing / Dev (Dummy Simulator)
      - targets: ["snmp-simulator:161"]
        labels:
          environment: "dev"
          device: "MikroTik-Dummy"
          instance: "mikrotik-dev"
          auth_module: "public_v2"

      # Jalur 2: Production (Router Fisik Kantor PT BPS)
      - targets: ["192.168.2.1:161"]
        labels:
          environment: "prod"
          device: "MikroTik-RB5009"
          instance: "mikrotik-prod"
          auth_module: "grafana_bps"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [auth_module]
        target_label: __param_auth
      - source_labels: [instance]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"
