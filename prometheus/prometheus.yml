global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Monitoring service Prometheus internal
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Monitoring Router MikroTik (Production PT Baja Perkasa Sentosa)
  - job_name: "snmp-mikrotik"
    metrics_path: /snmp
    params:
      module: [mikrotik]
      auth: [grafana_bps]
    static_configs:
      - targets: ["192.168.2.1:161"]
        labels:
          environment: "prod"
          device: "MikroTik-RB5009"
          instance: "mikrotik-prod"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [instance]
        target_label: instance
      - target_label: __address__
        replacement: "snmp-exporter:9116"
