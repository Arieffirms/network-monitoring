apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Telegram IT Support"
    receivers:
      - uid: "telegram_it_support"
        type: "telegram"
        disableResolveMessage: false
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "${TELEGRAM_CHAT_ID}"
          message: |
            {{ range .Alerts }}
            {{ if eq .Status "firing" }}🚨 [PERINGATAN SISTEM] {{ .Labels.alertname }} 🚨{{ else }}✅ [PULIH] {{ .Labels.alertname }} KEMBALI NORMAL ✅{{ end }}
            ━━━━━━━━━━━━━━━━━━━━━
            🏢 Perusahaan : PT Baja Perkasa Sentosa
            📡 Perangkat  : Router MikroTik ({{ if .Labels.device }}{{ .Labels.device }}{{ else }}RB5009UG+S+{{ end }})
            🏷️ Kategori   : {{ if .Labels.alert_category }}{{ .Labels.alert_category }}{{ else }}Infrastruktur{{ end }}
            ⚠️ Severity   : {{ if .Labels.severity }}{{ .Labels.severity }}{{ else }}warning{{ end }}
            ━━━━━━━━━━━━━━━━━━━━━
            📊 Detail Insiden:
            {{ .Annotations.description }}

            💡 Rekomendasi:
            Segera periksa Winbox RouterOS untuk verifikasi trafik, proses, atau log keamanan jaringan.

            🔗 Dashboard Monitoring:
            http://localhost:3000/d/mikrotik-snmp-advanced/mikrotik-monitoring-full-advanced
            ━━━━━━━━━━━━━━━━━━━━━
            {{ end }}

policies:
  - orgId: 1
    receiver: "Telegram IT Support"
    group_by:
      - "grafana_folder"
      - "alertname"
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h
