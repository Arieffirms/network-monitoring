apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Telegram IT Support"
    receivers:
      - uid: "telegram_it_support"
        type: "telegram"
        disableResolveMessage: false
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "1510478721"
          message: |
            {{ range .Alerts }}
            {{ if eq .Status "firing" }}🚨 [PERINGATAN] LONJAKAN TRAFIK TINGGI 🚨{{ else }}✅ [PULIH] TRAFIK KEMBALI NORMAL ✅{{ end }}
            ━━━━━━━━━━━━━━━━━━━━━
            🏢 Perusahaan : PT Baja Perkasa Sentosa
            📡 Perangkat  : Router MikroTik (RB750Gr3)
            🌐 Interface  : ether1-WAN (ISP Utama)
            ⚠️ Batas Aman : 80.00 Mbps
            ━━━━━━━━━━━━━━━━━━━━━
            📊 Detail Metrik:
            {{ .Annotations.description }}

            💡 Rekomendasi:
            Cek penggunaan bandwidth user atau unduhan besar via Winbox.

            🔗 Dashboard Monitoring:
            http://localhost:3000/d/mikrotik-network-overview/mikrotik-router-monitoring
            ━━━━━━━━━━━━━━━━━━━━━
            {{ end }}

policies:
  - orgId: 1
    receiver: "Telegram IT Support"
    group_by:
      - "grafana_folder"
      - "alertname"
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h
