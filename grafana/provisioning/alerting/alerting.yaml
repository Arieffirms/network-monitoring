apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Telegram IT Support"
    receivers:
      - uid: "telegram_it_support"
        type: "telegram"
        disableResolveMessage: false
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "1510478721"

policies:
  - orgId: 1
    receiver: "Telegram IT Support"
    group_by:
      - "grafana_folder"
      - "alertname"
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h
