name: bps-dummy-snmp

services:
  snmp-simulator:
    image: tandrup/snmpsim:v0.4
    container_name: snmp-simulator
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Port SNMP UDP di localhost
      - "127.0.0.1:161:161/udp"
    volumes:
      # Data OID MIB MikroTik dummy
      - ./data:/usr/local/snmpsim/data:ro
    networks:
      - bps-network-monitoring

networks:
  bps-network-monitoring:
    name: bps-network-monitoring
    external: true

