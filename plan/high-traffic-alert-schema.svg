<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxDummy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="boxProm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="boxGrafana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxTelegram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="boxPhone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ================= HEADER ================= -->
  <rect x="30" y="25" width="1140" height="75" rx="12" fill="url(#bgHeader)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="21" font-weight="bold">SKEMA ALUR DETEKSI &amp; NOTIFIKASI TRAFIK TINGGI</text>
  <text x="60" y="82" fill="#94a3b8" font-size="14">Simulasi Dummy SNMP MikroTik ➔ Prometheus ➔ Grafana Alerting ➔ Telegram Bot</text>
  <rect x="1000" y="45" width="145" height="34" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
  <text x="1072" y="67" fill="#f43f5e" font-size="13" font-weight="bold" text-anchor="middle">🚨 ALERT FIRING</text>

  <!-- ================= STEP 1: DUMMY ROUTER ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="200" height="280" rx="12" fill="url(#boxDummy)" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="55" y="155" width="80" height="22" rx="4" fill="#7c2d12"/>
    <text x="95" y="170" fill="#fed7aa" font-size="11" font-weight="bold" text-anchor="middle">STEP 1</text>
    <text x="55" y="202" fill="#ffffff" font-size="17" font-weight="bold">Router Dummy</text>
    <text x="55" y="222" fill="#fed7aa" font-size="12">tandrup/snmpsim</text>
    
    <rect x="55" y="240" width="170" height="160" rx="8" fill="#431407"/>
    <text x="65" y="260" fill="#f97316" font-size="11" font-weight="bold">KONDISI SIMULASI:</text>
    <text x="65" y="280" fill="#ffedd5" font-size="11">• ether1-WAN: Aktif</text>
    <text x="65" y="300" fill="#fecaca" font-size="11" font-weight="bold">• Trafik: 95 Mbps</text>
    <text x="65" y="320" fill="#fed7aa" font-size="10">(Download Besar!)</text>
    <text x="65" y="348" fill="#94a3b8" font-size="10">Counter OID:</text>
    <text x="65" y="365" fill="#e2e8f0" font-size="9">ifHCInOctets loncat</text>
    <text x="65" y="385" fill="#fdba74" font-size="10">Port: UDP 161</text>
  </g>

  <!-- Line 1 to 2 -->
  <line x1="240" y1="280" x2="275" y2="280" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="257" y="270" fill="#fb7185" font-size="10" text-anchor="middle">SNMP</text>

  <!-- ================= STEP 2: PROMETHEUS ================= -->
  <g filter="url(#shadow)">
    <rect x="275" y="140" width="200" height="280" rx="12" fill="url(#boxProm)" stroke="#fecdd3" stroke-width="1.5"/>
    <rect x="290" y="155" width="80" height="22" rx="4" fill="#881337"/>
    <text x="330" y="170" fill="#fecdd3" font-size="11" font-weight="bold" text-anchor="middle">STEP 2</text>
    <text x="290" y="202" fill="#ffffff" font-size="17" font-weight="bold">Prometheus</text>
    <text x="290" y="222" fill="#ffe4e6" font-size="12">TSDB Metric Engine</text>

    <rect x="290" y="240" width="170" height="160" rx="8" fill="#4c0519"/>
    <text x="300" y="260" fill="#fb7185" font-size="11" font-weight="bold">HITUNG RUMUS:</text>
    <text x="300" y="280" fill="#fecdd3" font-size="10">rate(ifHCInOctets[2m])</text>
    <text x="300" y="295" fill="#fecdd3" font-size="10">x 8 / 1000000</text>
    <text x="300" y="325" fill="#fda4af" font-size="11" font-weight="bold">Hasil Real-Time:</text>
    <rect x="300" y="335" width="150" height="30" rx="4" fill="#9f1239"/>
    <text x="375" y="355" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">95.4 Mbps</text>
    <text x="300" y="388" fill="#fda4af" font-size="10">Interval: Tiap 15 dtk</text>
  </g>

  <!-- Line 2 to 3 -->
  <line x1="475" y1="280" x2="510" y2="280" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="492" y="270" fill="#f59e0b" font-size="10" text-anchor="middle">Query</text>

  <!-- ================= STEP 3: GRAFANA ALERT ================= -->
  <g filter="url(#shadow)">
    <rect x="510" y="140" width="215" height="280" rx="12" fill="url(#boxGrafana)" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="525" y="155" width="80" height="22" rx="4" fill="#78350f"/>
    <text x="565" y="170" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">STEP 3</text>
    <text x="525" y="202" fill="#ffffff" font-size="17" font-weight="bold">Grafana Alerting</text>
    <text x="525" y="222" fill="#fef3c7" font-size="12">Unified Alert Rule</text>

    <rect x="525" y="240" width="185" height="160" rx="8" fill="#451a03"/>
    <text x="535" y="260" fill="#fbbf24" font-size="11" font-weight="bold">EVALUASI AMBANG:</text>
    <text x="535" y="280" fill="#fef3c7" font-size="11">• Batas Max: 80 Mbps</text>
    <text x="535" y="300" fill="#fca5a5" font-size="11" font-weight="bold">• Realita: 95.4 Mbps</text>
    <text x="535" y="325" fill="#fde68a" font-size="10">Kondisi: 95.4 &gt; 80 (True)</text>
    
    <rect x="535" y="340" width="165" height="45" rx="6" fill="#b91c1c"/>
    <text x="617" y="358" fill="#fee2e2" font-size="10" text-anchor="middle">STATUS BERUBAH:</text>
    <text x="617" y="375" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🚨 FIRING!</text>
  </g>

  <!-- Line 3 to 4 -->
  <line x1="725" y1="280" x2="760" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="742" y="270" fill="#38bdf8" font-size="10" text-anchor="middle">POST</text>

  <!-- ================= STEP 4: TELEGRAM API ================= -->
  <g filter="url(#shadow)">
    <rect x="760" y="140" width="200" height="280" rx="12" fill="url(#boxTelegram)" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="775" y="155" width="80" height="22" rx="4" fill="#0c4a6e"/>
    <text x="815" y="170" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle">STEP 4</text>
    <text x="775" y="202" fill="#ffffff" font-size="17" font-weight="bold">Telegram API</text>
    <text x="775" y="222" fill="#e0f2fe" font-size="12">api.telegram.org</text>

    <rect x="775" y="240" width="170" height="160" rx="8" fill="#082f49"/>
    <text x="785" y="260" fill="#38bdf8" font-size="11" font-weight="bold">KIRIM PESAN HTTP:</text>
    <text x="785" y="280" fill="#bae6fd" font-size="10">Target Chat ID:</text>
    <text x="785" y="296" fill="#ffffff" font-size="11" font-weight="bold">1510478721</text>
    <text x="785" y="325" fill="#bae6fd" font-size="10">Otentikasi Bot:</text>
    <text x="785" y="340" fill="#7dd3fc" font-size="9">Token 9115305134:***</text>
    <text x="785" y="365" fill="#bae6fd" font-size="10">Endpoint:</text>
    <text x="785" y="380" fill="#e0f2fe" font-size="9">/sendMessage (POST)</text>
  </g>

  <!-- Line 4 to 5 -->
  <line x1="960" y1="280" x2="995" y2="280" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="977" y="270" fill="#34d399" font-size="10" text-anchor="middle">Push</text>

  <!-- ================= STEP 5: IT SUPPORT PHONE ================= -->
  <g filter="url(#shadow)">
    <rect x="995" y="140" width="165" height="280" rx="12" fill="url(#boxPhone)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="1010" y="155" width="80" height="22" rx="4" fill="#064e3b"/>
    <text x="1050" y="170" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">STEP 5</text>
    <text x="1010" y="202" fill="#ffffff" font-size="17" font-weight="bold">HP / IT Support</text>
    <text x="1010" y="222" fill="#d1fae5" font-size="12">Telegram App</text>

    <rect x="1010" y="240" width="135" height="160" rx="8" fill="#022c22"/>
    <text x="1020" y="265" fill="#34d399" font-size="12" font-weight="bold">📲 NOTIFIKASI:</text>
    <text x="1020" y="295" fill="#fecaca" font-size="11" font-weight="bold">HP Berdering!</text>
    <text x="1020" y="325" fill="#e2e8f0" font-size="10">Pesan darurat</text>
    <text x="1020" y="342" fill="#e2e8f0" font-size="10">trafik tinggi</text>
    <text x="1020" y="360" fill="#e2e8f0" font-size="10">masuk ke layar</text>
    <text x="1020" y="380" fill="#34d399" font-size="10">real-time.</text>
  </g>

  <!-- ================= BOTTOM CARD: DETAIL PESAN ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="450" width="1120" height="260" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Left: Preview Chat Telegram -->
    <rect x="65" y="475" width="530" height="210" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="65" y="475" width="530" height="32" rx="10" fill="#0369a1"/>
    <text x="85" y="497" fill="#ffffff" font-size="13" font-weight="bold">💬 TAMPILAN PESAN DI TELEGRAM KAMU:</text>
    
    <text x="85" y="530" fill="#f43f5e" font-size="14" font-weight="bold">🚨 [ALERT] TRAFIK INTERNET KANTOR MELEBIHI BATAS!</text>
    <text x="85" y="555" fill="#cbd5e1" font-size="12">────────────────────────────────────────────</text>
    <text x="85" y="575" fill="#e2e8f0" font-size="12">• <tspan fill="#94a3b8">Perangkat :</tspan> Router MikroTik Kantor BPS (RB750Gr3)</text>
    <text x="85" y="595" fill="#e2e8f0" font-size="12">• <tspan fill="#94a3b8">Interface :</tspan> ether1-WAN (Jalur Utama Telkom/Biznet)</text>
    <text x="85" y="615" fill="#e2e8f0" font-size="12">• <tspan fill="#94a3b8">Trafik Saat Ini :</tspan> <tspan fill="#f43f5e" font-weight="bold">95.4 Mbps</tspan> (Ambang Batas: 80.0 Mbps)</text>
    <text x="85" y="635" fill="#e2e8f0" font-size="12">• <tspan fill="#94a3b8">Dampak :</tspan> Koneksi kantor berpotensi lemot / bandwidth habis!</text>
    <text x="85" y="660" fill="#38bdf8" font-size="11">🔗 Cek Grafik: http://localhost:3000/d/mikrotik-overview</text>

    <!-- Right: How it Resolves -->
    <rect x="620" y="475" width="515" height="210" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="620" y="475" width="515" height="32" rx="10" fill="#047857"/>
    <text x="640" y="497" fill="#ffffff" font-size="13" font-weight="bold">✅ KETIKA TRAFIK SUDAH NORMAL KEMBALI:</text>
    
    <text x="640" y="535" fill="#34d399" font-size="13" font-weight="bold">Sistem Otomatis Mengirim Notifikasi "RESOLVED":</text>
    <text x="640" y="565" fill="#cbd5e1" font-size="12">Begitu download selesai dan trafik turun ke bawah 80 Mbps</text>
    <text x="640" y="585" fill="#cbd5e1" font-size="12">(misal: kembali normal ke 14.2 Mbps), Grafana otomatis kirim:</text>
    
    <rect x="640" y="605" width="475" height="55" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="655" y="628" fill="#a7f3d0" font-size="12" font-weight="bold">✅ [RESOLVED] Trafik ether1-WAN Normal Kembali</text>
    <text x="655" y="648" fill="#e2e8f0" font-size="11">Penggunaan stabil di 14.2 Mbps (Waktu: 09:35 WIB)</text>
  </g>

</svg>